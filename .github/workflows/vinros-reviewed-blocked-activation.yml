name: VINROS Reviewed BLOCKED Activation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vinros-reviewed-blocked-activation.yml'
      - 'core/suppliers/automation.ts'
      - 'modules/suppliers/vinros-automation.ts'
      - 'modules/suppliers/SupabaseSupplierAutomationRepository.ts'
      - 'scripts/suppliers/approve-vinros-blocked-state.ts'
      - 'db/migrations/017_supplier_blocked_state_reviews.sql'

concurrency:
  group: vinros-production-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activate:
    if: github.event.head_commit.message == 'Activate reviewed VINROS blocked signature'
    name: Store exact review and execute controlled scheduler run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.RUNIA_PRODUCTION_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RUNIA_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      VINROS_TENANT_SLUG: lombardo
      VINROS_LIST_1_URL: ${{ secrets.VINROS_LIST_1_URL }}
      VINROS_LIST_2_URL: ${{ secrets.VINROS_LIST_2_URL }}
      VINROS_LIST_3_URL: ${{ secrets.VINROS_LIST_3_URL }}
      VINROS_LIST_4_URL: ${{ secrets.VINROS_LIST_4_URL }}
      VINROS_LIST_1_BASELINE_ROWS: '3233'
      VINROS_LIST_2_BASELINE_ROWS: '3230'
      VINROS_LIST_3_BASELINE_ROWS: '3231'
      VINROS_LIST_4_BASELINE_ROWS: '3875'
      VINROS_MINIMUM_PRODUCTS_PER_LIST: '10'
      VINROS_RUN_LEASE_SECONDS: '1800'
      VINROS_AUTOMATION_ENABLED: 'true'
      VINROS_AUTOMATION_TRIGGER_SOURCE: test
      VINROS_ALERT_EMAIL_ENABLED: 'false'
      VINROS_BLOCKED_REVIEW_CONFIRM: APPROVE_CH111B_EXACT_BLOCKED_STATE
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Store exact CH111B review signature
        run: node --import ./scripts/register-server-only-test-hook.mjs --import tsx scripts/suppliers/approve-vinros-blocked-state.ts

      - name: Execute scheduler-equivalent controlled run
        run: npm run sync:vinros:production:auto
